# @package _global_
# BUMI3 low-pose/ground-contact fine-tuning from a converged full-data policy.
# Keep this separate from sonic_bumi3.yaml so the 100k scratch baseline remains
# exactly reproducible.

defaults:
  - /exp/manager/universal_token/all_modes/sonic_bumi3
  - _self_

exp_var: ground_finetune

manager_env:
  rewards:
    # Kneeling, crawling and lying references require knee/torso/arm contact.
    # Preserve the normal non-foot contact penalty for upright references, but
    # do not punish contact that is necessary while the reference root is low.
    undesired_contacts:
      func: gear_sonic.envs.manager_env.mdp:reference_conditioned_undesired_contacts
      params:
        command_name: "motion"
        low_reference_height: 0.40
        low_pose_penalty_scale: 0.0

  terminations:
    # Early exploration of ground motions otherwise resets before the policy
    # receives enough recovery/contact experience. Upright thresholds remain
    # inherited from the scratch baseline.
    anchor_pos:
      params:
        down_threshold: 0.40
    anchor_ori_full:
      params:
        threshold: 1.0
    foot_pos_xyz:
      params:
        threshold: 0.35
    ee_body_pos:
      params:
        down_threshold: 0.50

  commands:
    motion:
      motion_lib_cfg:
        adaptive_sampling:
          # Use the full dataset for anti-forgetting replay, while directing
          # most non-uniform samples toward currently failing time bins.
          uniform_sampling_rate: 0.20
          quarantine:
            enable: false

algo:
  config:
    # Fine-tune conservatively from the converged 100k actor/value weights.
    actor_learning_rate: 1.0e-5
    critic_learning_rate: 5.0e-4
